name: beyond_performance
description: A high-performance, local-first workout tracker.
publish_to: 'none'
version: 0.1.6+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  drift: ^2.24.0
  sqlite3: ^2.5.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  fl_chart: ^0.66.2
  share_plus: ^12.0.0
  file_picker: ^10.0.0
  excel: ^4.0.0
  pdf: ^3.10.0
  printing: ^5.13.1
  intl: ^0.19.0
  uuid: ^4.3.3
  archive: ^3.6.1
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/db.sqlite
